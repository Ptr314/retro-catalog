# Alternative to Caddy: nginx + certbot.
server {
    listen 443 ssl http2;
    server_name catalog.emuverse.ru;

    ssl_certificate     /etc/letsencrypt/live/catalog.emuverse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog.emuverse.ru/privkey.pem;

    client_max_body_size 128m;

    # Large files: let nginx serve them, Node only counts the click on /dl/<slug>.
    location /files/ {
        alias /opt/retro-catalog/data/files/;
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        default_type application/octet-stream;
        expires 7d;
    }

    location /screenshots/ {
        alias /opt/retro-catalog/data/screenshots/;
        add_header Access-Control-Allow-Origin "*";
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name catalog.emuverse.ru;
    return 301 https://$host$request_uri;
}
