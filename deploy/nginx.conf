# nginx in front of the Node process. Installed as-is, then certbot adds TLS:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/catalog.emuverse.ru
#   sudo ln -s /etc/nginx/sites-available/catalog.emuverse.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d catalog.emuverse.ru
#
# It deliberately starts as plain HTTP: a config that names certificate files which do
# not exist yet fails `nginx -t`. certbot rewrites the installed copy (listen 443,
# certificate paths, the http -> https redirect); this file in the repo stays as it is.
server {
    listen 80;
    server_name catalog.emuverse.ru;

    # nginx accepts 1 MB bodies by default; disk images are uploaded as one PUT.
    # Keep this above maxFileBytes from config.json, or uploads die with 413.
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The app's same-origin check compares Origin with Host: without this line every
        # POST from the admin is rejected with 403.
        proxy_set_header Host $host;
        # Login throttling counts attempts per client address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional, for large files: let nginx serve them from disk, bypassing Node.
    # The catch: CORS then comes from here ("*"), and corsOrigins in config.json stops
    # applying to these paths. Counters are unaffected — they live on /dl/ and /run/.
    #
    # location /files/ {
    #     alias /var/www/catalog/data/files/;
    #     add_header Access-Control-Allow-Origin "*";
    #     add_header X-Content-Type-Options "nosniff";
    #     default_type application/octet-stream;
    #     expires 7d;
    # }
    # location /screenshots/ {
    #     alias /var/www/catalog/data/screenshots/;
    #     add_header Access-Control-Allow-Origin "*";
    #     expires 7d;
    # }
}
